name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.5.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}
      - name: Download Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
      - name: Import project
        run: timeout 300 ~/godot/godot --headless --path . --import
      - name: Run tests
        # Godot reports script errors without failing, so treat any SCRIPT ERROR as a failure too.
        run: |
          set -o pipefail
          timeout 600 ~/godot/godot --headless --fixed-fps 120 --path . res://tests/test_runner.tscn 2>&1 | tee test.log
          ! grep -q "SCRIPT ERROR" test.log
